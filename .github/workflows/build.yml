name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows gets the full solution, including the WinForms tray shell.
          - os: windows-latest
            solution: CacheSweep.sln
          # Linux can only build the cross-platform projects: the desktop shell
          # is net8.0-windows + WinForms and cannot be restored here.
          - os: ubuntu-latest
            solution: CacheSweep.CrossPlatform.slnf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ matrix.solution }} --no-build -c Release

  package:
    name: Package win-x64
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Produces the tray shell + hidden server + web assets in one folder,
      # plus the standalone CLI, then zips both.
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            'artifacts/package/CacheSweep.exe',
            'artifacts/package/CacheSweep.Server.exe',
            'artifacts/package/wwwroot/index.html',
            'artifacts/package/Assets/cachesweep.ico',
            'artifacts/package/Assets/themes/fruit-orange.ico',
            'artifacts/package/Assets/themes/fruit-grape.ico',
            'artifacts/package/Assets/themes/fruit-sugarcane.ico'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing from package: $f" }
          }
          Get-ChildItem artifacts/dist | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CacheSweep-win-x64
          path: artifacts/dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dist/*.zip
          generate_release_notes: true
